; PlatformIO Project Configuration File
; Default firmware: Web/WiFi + Gamepad BLE switching with OTA, camera bridge,
; settings, and integrated motion core.
;
; BLE is compiled into the default firmware so the Web UI can switch between
; WiFi control and gamepad mode. Runtime still starts only one control
; path: WiFi/Web when enable_gamepad=false, Gamepad BLE when enable_gamepad=true.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
extra_scripts = pre:scripts/build_web_ui.py
monitor_speed = 115200
monitor_echo = yes
monitor_rts = 0
monitor_dtr = 0
build_flags =
	-D WIRE_SCL=15
	-D WIRE_SDA=4
	-D ENABLE_GAMEPAD_BLE=1
	-I lib/MotionCore/controller
	-I lib/MotionCore/controller/algorithm
	-I lib/MotionCore/devices
	-I lib/MotionCore/drivers
	-I lib/MotionCore/drivers/bus
	-I lib/MotionCore/system

board_build.merge_bins = true
; 1.875MB x2 OTA app slots + 128KB SPIFFS. This preserves OTA rollback while
; giving the application more room than the default partition table.
board_build.partitions = min_spiffs.csv
lib_deps =
	h2zero/NimBLE-Arduino@1.4.2

[env:esp32dev_wifi_only]
extends = env:esp32dev
build_flags =
	-D WIRE_SCL=15
	-D WIRE_SDA=4
	-I lib/MotionCore/controller
	-I lib/MotionCore/controller/algorithm
	-I lib/MotionCore/devices
	-I lib/MotionCore/drivers
	-I lib/MotionCore/drivers/bus
	-I lib/MotionCore/system
lib_deps =

[env:esp32dev_bt]
extends = env:esp32dev
